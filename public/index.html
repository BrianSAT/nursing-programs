<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nursing Program Matrix</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <h1>Nursing Program Evaluation Matrix</h1>
    <p>Comparing ABSN programs for Spring 2027</p>
  </header>

  <main>
    <div class="controls">
      <input type="text" id="search" placeholder="Search programs or locations...">
      <select id="type-filter">
        <option value="">All Types</option>
        <option value="ABSN">ABSN</option>
        <option value="DEMSN">DEMSN</option>
        <option value="DABSN">DABSN</option>
        <option value="MN">MN</option>
        <option value="GEM">GEM</option>
      </select>
      <select id="data-filter">
        <option value="">All Data Status</option>
        <option value="complete">Complete Only</option>
        <option value="needs-data">Needs Data</option>
      </select>
    </div>

    <div class="stats" id="stats"></div>

    <table id="programs-table">
      <thead>
        <tr>
          <th class="sortable" data-sort="rank">Rank</th>
          <th class="sortable" data-sort="name">Program</th>
          <th class="sortable" data-sort="type">Type</th>
          <th class="sortable" data-sort="location">Location</th>
          <th class="sortable" data-sort="duration">Duration</th>
          <th class="sortable" data-sort="start_date">Start Date</th>
          <th class="sortable" data-sort="deadline">Deadline</th>
          <th class="sortable" data-sort="monthly_burn">$/Month</th>
          <th class="sortable sort-desc" data-sort="raw_score">Score</th>
          <th class="sortable" data-sort="status">Status</th>
        </tr>
      </thead>
      <tbody id="programs-body">
      </tbody>
    </table>

    <div id="loading">Loading programs...</div>
    <div id="error" class="hidden"></div>
  </main>

  <!-- Detail Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
