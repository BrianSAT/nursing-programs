<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nursing Program Matrix</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <h1>Nursing Program Evaluation Matrix</h1>
    <p>Comparing ABSN programs for Spring 2027</p>
  </header>

  <main>
    <div class="controls">
      <input type="text" id="search" placeholder="Search programs or locations...">
      <select id="type-filter">
        <option value="">All Types</option>
        <option value="ABSN">ABSN</option>
        <option value="DEMSN">DEMSN</option>
        <option value="DABSN">DABSN</option>
        <option value="MN">MN</option>
        <option value="GEM">GEM</option>
      </select>
      <select id="data-filter">
        <option value="">All Data Status</option>
        <option value="complete">Complete Only</option>
        <option value="needs-data">Needs Data</option>
      </select>
      <select id="sort-by">
        <option value="raw_score">Sort by Score</option>
        <option value="rank">Sort by Rank</option>
        <option value="duration">Sort by Duration</option>
        <option value="monthly_burn">Sort by Monthly Cost</option>
        <option value="start_date">Sort by Start Date</option>
        <option value="deadline">Sort by Deadline</option>
        <option value="name">Sort by Name</option>
      </select>
    </div>

    <div class="stats" id="stats"></div>

    <table id="programs-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Program</th>
          <th>Type</th>
          <th>Location</th>
          <th>Duration</th>
          <th>Start Date</th>
          <th>Deadline</th>
          <th>$/Month</th>
          <th>Score</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="programs-body">
      </tbody>
    </table>

    <div id="loading">Loading programs...</div>
    <div id="error" class="hidden"></div>
  </main>

  <!-- Detail Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
